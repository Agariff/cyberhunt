name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
      - name: Move files into correct folders
        run: |
          mkdir -p app/src/main/java/com/example/cyberhunt
          mkdir -p app/src/main/res/values
          mv AndroidManifest.xml app/src/main/
          mv MainActivity.kt app/src/main/java/com/example/cyberhunt/
          mv ScreenShareService.kt app/src/main/java/com/example/cyberhunt/
          mv strings.xml app/src/main/res/values/
      - name: Build
        run: |
          gradle wrapper
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CyberHunt-APK
          path: app/build/outputs/apk/debug/app-debug.apk
